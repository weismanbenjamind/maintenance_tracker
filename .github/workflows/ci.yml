name: CI

on:
  pull_request:
    paths:
      - src/**
      - .github/workflows/ci.yml
      - Cargo.toml
      - Cargo.lock

  push:
    branches:
      - master
    paths:
      - src/**
      - .github/workflows/ci.yml
      - Cargo.toml
      - Cargo.lock

  workflow_dispatch:
    inputs:
      runs-on:
        type: choice
        default: macos-26
        options:
          - macos-14
          - macos-15
          - macos-26
          - macos-latest
        description: macOS version to run on

      rust-version:
        type: string
        default: stable
        description: Rust toolchain version used to test

jobs:
  test-and-lint:
    runs-on: ${{ inputs.runs-on  || 'macos-26'}}
    steps:
      - name: Checkout Code
        id: checkout-code
        uses: actions/checkout@v4

      - name: Install Rust
        id: install-rust
        run: rustup update ${{ inputs.rust-version || 'stable'}}

      - name: Install Nightly Format
        id: install-nightly-format
        run: rustup component add --toolchain nightly-aarch64-apple-darwin rustfmt

      - name: Test and Lint
        id: test-and-lint
        run: ./scripts/ci.sh
