repos:
  - repo: local
    hooks:
      - id: format_nightly
        name: Format Nightly
        entry: ./scripts/format_nightly.sh
        language: script
        pass_filenames: false

      - id: clippy
        name: Clippy
        entry: ./scripts/clippy.sh
        language: script
        pass_filenames: false

      - id: cargo_check
        name: Cargo Check
        entry: ./scripts/check.sh
        language: script
        pass_filenames: false
